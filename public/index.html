<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI RP Room</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app" class="screen app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <div class="eyebrow">World</div>
          <h2>AI RP Room</h2>
        </div>
        <button id="settingsBtn" class="icon-btn" title="ตั้งค่า">⚙️</button>
      </div>

      <div class="panel">
        <div class="panel-label">เรื่องราว</div>
        <div id="scenarioBanner" class="scenario-banner"></div>
      </div>

      <div class="panel">
        <div class="panel-label">ผู้เล่น</div>
        <div id="playersList" class="players-list"></div>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <div class="eyebrow">Session</div>
          <h1>ห้องเล่นบทบาท</h1>
        </div>
      </header>

      <div id="chat" class="chat"></div>

      <div id="composer" class="composer">
        <textarea id="input" rows="2" placeholder="พิมพ์สิ่งที่ตัวละครของคุณพูดหรือทำ..."></textarea>
        <div class="actions">
          <button id="aiBtn" class="secondary">🤖 ให้ AI เล่าเรื่องต่อ</button>
          <button id="sendBtn" class="primary subtle">ส่ง</button>
        </div>
      </div>
    </main>
  </div>

  <div id="settingsModal" hidden>
    <div class="sheet">
      <h2>ตั้งค่าเอกลักษณ์ตัวละคร</h2>

      <div class="field">
        <label>ชื่อของคุณ</label>
        <input id="profileNameInput" maxlength="40">
      </div>

      <div class="field">
        <label>ชื่อลักษณะตัวละคร</label>
        <input id="profileCharacterNameInput" maxlength="40">
      </div>

      <div class="field">
        <label>ลักษณะ / บุคลิก / ความสามารถ</label>
        <textarea id="profileCharacterTraitInput" maxlength="200" placeholder="เช่น อาวุธหวายหลาก, มีความอดทน, คิดเร็ว, ใช้เวทมนตร์..."></textarea>
      </div>

      <div class="field">
        <label>ตั้งค่าโลก / เอกสาร PDF</label>
        <input id="worldPdfInput" type="file" accept="application/pdf">
      </div>

      <div class="field">
        <label>ฉาก / บริบทเรื่อง (ทุกคนเห็นร่วมกัน)</label>
        <textarea id="scenarioInput" placeholder="เช่น โลกแฟนตาซียุคกลาง มีเวทมนตร์และมังกร..."></textarea>
      </div>

      <div class="sheet-actions">
        <button id="closeSettingsBtn" class="secondary">ปิด</button>
        <button id="saveSettingsBtn" class="primary">บันทึก</button>
      </div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
